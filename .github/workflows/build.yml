              <TextView android:id="@+id/wt" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textColor="#99FFFFFF" android:textSize="10sp" android:maxLines="1"/>
          </LinearLayout>
          EOF12
          mkinfo() { # имя minW minH cellW cellH minResW minResH resizeMode layout maxResW maxResH
          cat > $R/xml/$1.xml <<EOF13
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="$2dp"
              android:minHeight="$3dp"
              android:minResizeWidth="$6dp"
              android:minResizeHeight="$7dp"
              android:maxResizeWidth="${10}dp"
              android:maxResizeHeight="${11}dp"
              android:targetCellWidth="$4"
              android:targetCellHeight="$5"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/$9"
              android:resizeMode="$8"
              android:widgetCategory="home_screen"/>
          EOF13
          }
          mkinfo widget_compact_info 250 40 4 1 110 40 "horizontal|vertical" widget_compact 420 100
          mkinfo widget_next_info 110 110 2 2 110 110 "horizontal|vertical" widget_next 250 250
          mkinfo widget_today_info 250 250 4 4 180 140 "horizontal|vertical" widget_today 420 420
          mkinfo widget_tomorrow_info 250 250 4 4 180 140 "horizontal|vertical" widget_today 420 420
          mkinfo widget_week_info 250 110 4 2 250 100 "horizontal|vertical" widget_week 420 180
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          items=[('CompactWidget','widget_compact_info','ПМК · Строка'),('NextWidget','widget_next_info','ПМК · Следующая пара'),('TodayWidget','widget_today_info','ПМК · Сегодня'),('TomorrowWidget','widget_tomorrow_info','ПМК · Завтра'),('WeekWidget','widget_week_info','ПМК · Неделя')]
          r=''
          for i,(c,x,lab) in enumerate(items):
              extra='<action android:name="android.intent.action.DATE_CHANGED"/><action android:name="android.intent.action.TIME_SET"/><action android:name="android.intent.action.TIMEZONE_CHANGED"/>' if i==0 else ''
              r+='<receiver android:name=".%s" android:label="%s" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>%s</intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/%s"/></receiver>'%(c,lab,extra,x)
          assert '</application>' in s
          s=s.replace('</application>',r+'</application>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -c "Widget" android/app/src/main/AndroidManifest.xml
      - name: Signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Секрет KS_B64 не задан — подпись временная"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > sign.gradle.txt <<'EOF2'
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KS_ALIAS')
                      keyPassword System.getenv('KS_PASS')
                  }
              }
          EOF2
          sed -i '/^android {/r sign.gradle.txt' android/app/build.gradle
      - name: Icon (только если в репозитории есть PNG)
        run: |
          if ls *.png >/dev/null 2>&1; then
            mkdir -p assets
            cp "$(ls *.png | head -n1)" assets/icon.png
            npm i --legacy-peer-deps @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          fi
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pmk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (обновление для пользователей)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          APK="pmk-$VERSION_NAME.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          TEXT=$(printf '%s' "$COMMIT_MSG" | head -n1)
          case "$TEXT" in "Add files via upload"*|"Update "*|"Create "*|"Rename "*|"Delete "*) TEXT="";; esac
          jq -n --arg v "$VERSION_NAME" --arg t "$TEXT" --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION_NAME/$APK" '{version:$v,text:$t,url:$u}' > version.json
          cat version.json
          gh release create "v$VERSION_NAME" "$APK" version.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Версия $VERSION_NAME" --notes "${TEXT:-Обновление}"
