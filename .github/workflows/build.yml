                  <TextView android:id="@+id/wn" android:layout_width="match_parent" android:layout_height="match_parent"
                      android:gravity="center" android:textColor="#FFFFFFFF" android:textSize="14sp" android:textStyle="bold" android:maxLines="1"/>
              </FrameLayout>
              <TextView android:id="@+id/wp" android:layout_width="wrap_content" android:layout_height="wrap_content"
