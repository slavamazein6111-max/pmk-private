const notifSnd=mkSnd(NOTIF_SRC,-4.3);
const sndBtn=$('snd');
function paintSnd(){sndBtn.classList.toggle('off',sndMuted);sndBtn.setAttribute('aria-pressed',sndMuted?'true':'false');sndBtn.setAttribute('aria-label',sndMuted?'Звук выключен':'Звук включён')}
sndBtn.onclick=()=>{sndMuted=!sndMuted;try{localStorage.setItem('pmk-mute',sndMuted?'1':'0')}catch(err){}paintSnd();if(!sndMuted)clickSnd()};
paintSnd();
$('days').onclick=e=>{const b=e.target.closest('.d');if(b){clickSnd();go(b.dataset.d)}};
$('today').onclick=()=>go(todayS());
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.mode=b.dataset.m;persist();render()};
addEventListener('keydown',e=>{
if($('ov').classList.contains('show')){if(e.key==='Escape')closeSheet();return}
if($('dev').classList.contains('show')){if(e.key==='Escape')$('dev').classList.remove('show');return}
if($('set').classList.contains('show')){if(e.key==='Escape')$('set').classList.remove('show');return}
if(e.target.tagName==='INPUT')return;
if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);
});
let tx=0,ty=0;
$('main').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('main').addEventListener('touchend',e=>{
const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)>70&&Math.abs(dy)<45){swipeSnd();step(dx<0?1:-1)}
},{passive:true});
let shMode='group',shCb=null,shCur='';
function openSheet(mode=st.mode,cb=null,cur=st.ent[mode]){
shMode=mode;shCb=cb;shCur=cur;
$('q').value='';$('q').placeholder={group:'Найти группу',teacher:'Найти преподавателя',aud:'Найти аудиторию'}[mode];
fillSheet();$('ov').classList.add('show');setTimeout(()=>$('q').focus(),480);
}
function closeSheet(){$('ov').classList.remove('show')}
function fillSheet(){

async function installUpd(){   // скачать APK внутри приложения и открыть установщик Android — браузер не открывается
if(!upd||updBusy)return;
const u=upd;

if(!u.sim&&!AU){setUpdUI('err',0,NOINST);return}
updBusy=true;let h=null;
try{

for(let p=0;p<=100;p+=4){
setUpdUI('dl',p);
if(u.sim==='fail'&&!u.tried&&p>=60){u.tried=true;throw new Error('обрыв связи (имитация)')}
await sleep(100);
}
setUpdUI('inst',100);await sleep(900);
toast('Тест пройден','Загрузка и установщик отработали, ничего не устанавливалось');
endUpdTest();return;
}
try{h=await AU.addListener('progress',e=>setUpdUI('dl',e.percent))}catch(e){}
if(!u.got){
setUpdUI('dl',0);
const d=await AU.download({url:u.url});
u.got=true;u.size=d&&d.size;
}
if(u.noInstall){toast('Загрузка работает',`APK скачан${u.size?' · '+(u.size/1048576).toFixed(1)+' МБ':''}. Установка не запускалась`);u.got=false;endUpdTest();return}
setUpdUI('inst',100);
const r=await AU.install();

else setUpdUI('idle');
}catch(e){
u.got=false;
const m=String(e&&e.message||e);
setUpdUI('err',0,/not implemented|UNIMPLEMENTED/i.test(m)?NOINST:'Не удалось обновить: '+m);
}finally{try{h&&h.remove()}catch(e){}updBusy=false}
}

if(!upd||!permOK){if(old.length)await LN.cancel({notifications:old.map(n=>({id:n.id}))});return}

for(let i=1;i<=24;i++)list.push({id:50000+i,title:`Вышла версия ${upd.version}`,body:`${upd.text||'Обновите приложение'} · у вас ${APP_VERSION}`,channelId:'pmk',actionTypeId:'UPD',extra:{url:upd.url},schedule:{at:new Date(Date.now()+i*300000),allowWhileIdle:true}});

}

async function enableNotif(){

const SPLASH_HTML=$('splash').innerHTML;
const splashStart=Date.now();
const SP_FLY=2000,SP_END=3000;
function runSplash(sp){
const t=sp.querySelector('.sp-t'),B=document.body;
// буквы: каждая проявляется волной слева направо (как в видео)
const parts=[...t.childNodes].map(n=>({txt:n.textContent,k:n.nodeType===1}));
t.textContent='';
parts.forEach(p=>[...p.txt].forEach(ch=>{
if(ch===' '){t.appendChild(document.createTextNode(' '));return}
const c=document.createElement('span');c.className='sp-c'+(p.k?' k':'');c.textContent=ch;t.appendChild(c)}));
const fit=()=>{
t.style.fontSize='100px';
const w=t.getBoundingClientRect().width||1;
t.style.fontSize=(100*Math.min(innerWidth*.776,560)/w)+'px';
const bb=sp.querySelector('.sp-b');if(bb)bb.style.top=(t.getBoundingClientRect().bottom+12)+'px';
};
fit();
const cs=[...t.querySelectorAll('.sp-c')];
try{splashSnd()}catch(e){}
const tw=t.getBoundingClientRect().width||1,l0=t.getBoundingClientRect().left;
cs.forEach(c=>{const f=Math.max(0,(c.getBoundingClientRect().left-l0)/tw);c.style.setProperty('--d',(.43+f*.7).toFixed(3)+'s')});
t.classList.add('rdy');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!t.classList.contains('go'))fit()});
setTimeout(()=>{
const r=t.getBoundingClientRect(),br=document.querySelector('.brand'),rg=document.createRange();
rg.setStartBefore(br.firstChild);rg.setEndAfter(br.querySelector('i'));
const b=rg.getBoundingClientRect(),k=b.width/r.width;
t.style.left=r.left+'px';t.style.top=r.top+'px';t.style.transform='none';
void t.offsetWidth;
t.classList.add('go');
t.style.transform=`translate(${b.left-r.left}px,${b.top+b.height/2-r.top-r.height*k/2}px) scale(${k})`;
B.classList.remove('pre');B.classList.add('rev');const bb=sp.querySelector('.sp-b');if(bb)bb.classList.add('out');
},SP_FLY);
setTimeout(()=>{B.classList.remove('hb');t.classList.add('fade');setTimeout(()=>{sp.remove();setTimeout(()=>B.classList.remove('rev'),300)},260)},SP_END);
}

(function(){
const root=document.documentElement,STEPS=[30,48,60,72,90,100,120,144,165,240];
let busy=false;
window.__measureHz=function(frames){
frames=frames||60;
if(busy||document.hidden)return Promise.resolve(window.__hz||0);
busy=true;
return new Promise(res=>{
const d=[];let last=0;
function f(t){
if(last)d.push(t-last);last=t;
if(d.length<frames&&!document.hidden){requestAnimationFrame(f);return}
busy=false;
if(d.length>8){
d.sort((a,b)=>a-b);
const raw=1000/d[d.length>>1];
const hz=STEPS.reduce((b,x)=>Math.abs(x-raw)<Math.abs(b-raw)?x:b,60);
window.__hzRaw=Math.round(raw);window.__hz=hz;
root.dataset.hz=hz;root.style.setProperty('--hz',hz);
root.classList.toggle('hi-hz',hz>=90);
}
res(window.__hz||0);
}
requestAnimationFrame(f);
});
};
setTimeout(()=>window.__measureHz(),5000);   /* после заставки и «лайт»-замера */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>window.__measureHz(),800)});
})();

(function(){
let el=null,on=false,raf=0,n=0,t0=0,last=0,worst=0;
function frame(t){
if(!on)return;
if(!t0){t0=t;last=t}
worst=Math.max(worst,t-last);last=t;n++;
if(t-t0>=500){
const fps=Math.round(n*1000/(t-t0)),min=Math.round(1000/worst),hz=window.__hz||60;
const r=fps/hz,c=r>.9?'#4ade80':r>.6?'#facc15':'#f87171';
el.innerHTML=`<b style="color:${c}">${fps}</b> FPS<small> · мин ${min} · ${hz} Гц</small>`;
n=0;t0=t;worst=0;
}
raf=requestAnimationFrame(frame);
}
window.__toggleFps=function(){
on=!on;window.__fpsOn=on;
if(on){
if(!el){
el=document.createElement('div');
el.style.cssText='position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:8px;z-index:9999;pointer-events:none;background:rgba(0,0,0,.72);color:#fff;font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 9px;border-radius:10px';
document.body.appendChild(el);
}
el.style.display='';el.textContent='…';n=0;t0=0;worst=0;
raf=requestAnimationFrame(frame);
}else{
cancelAnimationFrame(raf);if(el)el.style.display='none';
}
};
})();
